version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: glossa_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: glossa
      POSTGRES_PASSWORD: glossa_password
      POSTGRES_DB: glossa_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/scripts/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossa -d glossa_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
